---

name: Coverage

on:
  push:
    branches: [master, ros2]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
      - '.github/dependabot.yml'
  pull_request:
    branches: [master, ros2]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE*'
      - '.github/dependabot.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: "${{ matrix.component.name }} (ROS ${{ matrix.ros_distro }})"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        ros_distro: [kilted]
        component:
          - name: libmavconn
            packages: libmavconn
            source_filter: ".*/libmavconn/.*"
          - name: mavros
            packages: mavros
            source_filter: ".*/mavros/.*"
          - name: mavros_extras
            packages: mavros_extras
            source_filter: ".*/mavros_extras/.*"

    env:
      ROS_DISTRO: ${{ matrix.ros_distro }}
      COMPONENT_NAME: ${{ matrix.component.name }}
      COMPONENT_PACKAGES: ${{ matrix.component.packages }}
      COMPONENT_FILTER: ${{ matrix.component.source_filter }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      # Enable the libmavconn e2e test dep (python3-pymavlink-pip) and allow
      # rosdep to pip-install it on PEP 668 distros (jazzy+)
      TEST_ENABLE_E2E: "1"
      PIP_BREAK_SYSTEM_PACKAGES: "1"

    steps:
      - uses: actions/checkout@v7  # nosemgrep

      - uses: ros-tooling/setup-ros@649ef6bcd696da05bc27ceb3fab69d810c0daeab
        with:
          required-ros-distributions: ${{ env.ROS_DISTRO }}

      - name: Install Coverage Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcovr ccache

      - uses: actions/cache@v6  # nosemgrep
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: "ccache-cov-${{ runner.os }}-${{ matrix.ros_distro }}-${{ matrix.component.name }}-${{ hashFiles('**/package.xml', '**/CMakeLists.txt') }}"
          restore-keys: |
            ccache-cov-${{ runner.os }}-${{ matrix.ros_distro }}-${{ matrix.component.name }}-

      - name: Install Dependencies
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          rosdep update
          rosdep install --from-paths . --ignore-src --rosdistro ${ROS_DISTRO} -y

      - name: Install GeographicLib Datasets
        shell: bash
        run: |
          sudo ./mavros/scripts/install_geographiclib_datasets.sh

      - name: Build With Coverage
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          colcon build --packages-up-to ${COMPONENT_PACKAGES} --cmake-args \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_FLAGS=--coverage \
            -DCMAKE_CXX_FLAGS=--coverage \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Run Tests
        shell: bash
        run: |
          source /opt/ros/${ROS_DISTRO}/setup.bash
          source install/setup.bash
          colcon test --packages-select ${COMPONENT_PACKAGES}
          colcon test-result --verbose

      - name: Generate Coverage Report
        shell: bash
        run: |
          mkdir -p coverage/${COMPONENT_NAME}
          gcovr \
            --root "${GITHUB_WORKSPACE}" \
            --filter "${COMPONENT_FILTER}" \
            --xml-pretty \
            --output "coverage/${COMPONENT_NAME}/coverage.xml" \
            --html-details "coverage/${COMPONENT_NAME}/coverage.html" \
            --exclude-unreachable-branches \
            "${GITHUB_WORKSPACE}/build"

      - name: Upload Coverage Artifact
        uses: actions/upload-artifact@v7  # nosemgrep
        with:
          name: coverage-${{ matrix.component.name }}-${{ matrix.ros_distro }}
          path: coverage/${{ matrix.component.name }}
          if-no-files-found: error

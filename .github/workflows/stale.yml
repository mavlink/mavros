---

name: Close stale issues

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  issues: write
  pull-requests: read

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 90
          days-before-issue-close: 30
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          close-issue-reason: not planned
          stale-issue-message: >
            This issue has had no activity for 90 days. It will be closed in
            30 days unless there is an update.
          close-issue-message: >
            Closing this issue because it has remained inactive. Please reopen
            it if it is still relevant.
          exempt-all-issue-milestones: true
          exempt-all-issue-assignees: true
          operations-per-run: 30

version: 2
updates:
- package-ecosystem: "github-actions"
  directory: "/"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
- package-ecosystem: "uv"
  directory: "/tools"
  schedule:
    interval: "weekly"
  cooldown:
    default-days: 7
# NOTE: /docs/requirements.txt is autogenerated by
#   uv export --group docs --no-hashes --no-emit-project
# from tools/ (managed by the "uv" ecosystem above). Do not track it with
# the "pip" ecosystem to avoid duplicate/conflicting update PRs.

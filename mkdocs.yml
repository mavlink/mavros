---
site_name: MAVROS a MAVLink to ROS2 bridge
repo_url: https://github.com/mavlink/mavros

nav:
  - Home: index.md
  - Installation: installation.md
  - Plugins:
      - plugins/index.md
      - Standard plugins (mavros): plugins/std/
      - Extra plugins (mavros_extras): plugins/extras/
      - QoS profiles: plugins/qos.md
  - Examples:
      - examples/task_control.md
      - examples/waypoint_mission.md
  - Changelog: changelog.md
  - History: history.md

plugins:
  - autorefs
  - markdown-exec
  - search
  - material/tags
  - mkdocstrings:
      handlers:
        python:
          paths:
            - ./mavros/mavros
          options:
            show_source: false
            show_root_toc_entry: false
            show_symbol_type_heading: true
            allow_inspection: true
            extensions:
              - griffe_typingdoc
              - griffe_fieldz
              - griffe_sphinx

theme:
  name: material
  # name: readthedocs
  features:
    - content.code.copy
    - content.code.annotate
    # - content.action.edit
    - navigation.expand
    - navigation.sections
    - navigation.instant
    - navigation.indexes
    - navigation.tracking
    - toc.integrate

validation:
  nav:
    # Directory nav entries (e.g. `plugins/std/`) expand their children
    # correctly but mkdocs still logs a spurious "not found" warning.
    not_found: info

markdown_extensions:
  - mkdocs-click
  - markdown_include.include:
      base_path: docs
  - admonition
  - sane_lists
  - attr_list
  - def_list
  - footnotes
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.magiclink
  - pymdownx.tabbed
  - toc
